<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameZone - Premium Puzzle Games</title>
  <link rel="stylesheet" href="css/games-style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
</head>
<body>
  <!-- Loading Animation -->
  <div class="loader">
    <div class="loader-content">
      <div class="loader-icon">🎮</div>
      <div class="loader-text">GameZone</div>
      <div class="loader-bar">
        <div class="loader-progress"></div>
      </div>
    </div>
  </div>

  <canvas id="particles"></canvas>

  <div class="cursor-dot"></div>
  <div class="cursor-outline"></div>
  <div class="mouse-glow"></div>

  <!-- Navigation -->
  <nav class="navbar">
    <a href="index.html" class="nav-logo">
      <div class="logo-icon">GZ</div>
      <div class="logo-text">
        <h2><span class="gradient-name">GameZone</span></h2>
        <small>PREMIUM PUZZLE GAMES</small>
      </div>
    </a>
</body>
</html>
